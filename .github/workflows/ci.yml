name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test

      - run: clojure -M:lint

  # `.cljc` is a claim about two platforms and the JVM job checks one. This runs
  # the portable half — everything up to the signature — on nbb (SCI), using the
  # same fixtures. It is a SMALLER claim than the JVM job makes and says so: a
  # green run here means the structural half loads and answers correctly on
  # ClojureScript, not that a signature was verified there.
  #
  # `clojure -Spath` supplies the classpath so the git deps resolve to the same
  # pinned sources both jobs use.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g nbb@1.3.197
      - run: clojure -P
      - name: Test the portable half on nbb (ClojureScript)
        run: nbb --classpath "$(clojure -Spath)" run_tests.cljs
